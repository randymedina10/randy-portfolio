<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tres en raya · Randy A. Medina</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-game="tres-en-raya">
    <h1>Tres en raya</h1>
    <div id="status" class="status" role="status" aria-live="polite">
      Preparando juego…
    </div>
    <div id="board" role="group" aria-label="Tablero de juego"></div>
    <button id="reset" disabled>Nueva partida</button
    ><button id="retry" hidden>Reintentar carga</button>
    <p class="hint">
      Dos jugadores locales · X comienza · Completa una línea de tres.
    </p>
    <script src="app.js" defer></script>
  </body>
</html>
